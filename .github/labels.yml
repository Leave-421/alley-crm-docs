# 레포 라벨 정의 (기획 저장소 docs/plan/Git 전략.md 「라벨」).
# 종류 라벨은 이슈 템플릿이 붙인다. 영역 라벨은 선택이다.
# GitHub 기본 라벨은 bug 만 남기고 지운다.
# 커밋 scope 를 쓸 때는 area: 뒤의 값과 같게 쓴다. 예: feat(reservation): …
#
# setup.ps1 이 이 파일을 읽어 GitHub 라벨을 만든다(주석 처리된 항목은 건너뜀).
# 이후 라벨을 바꾸면 이 파일과 GitHub 라벨을 함께 고친다.

# 종류 라벨
- name: feature
  color: "1d76db"
  description: "Feature 템플릿. 브랜치·커밋 type: feat"
- name: bug
  color: "d73a4a"
  description: "Bug 템플릿. 브랜치·커밋 type: fix"
- name: chore
  color: "cfd3d7"
  description: "Task 템플릿. 브랜치·커밋 type: chore, refactor, test, docs 중 맞는 것"

# 영역 라벨 — TODO: 요구사항 정의서의 기능 그룹이 확정되면 주석을 풀고 고친다.
